name: nareulbom
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nareulbom
      POSTGRES_USER: nareulbom_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - auth-db:/var/lib/postgresql/data
      - ./init-auth-db.sh:/docker-entrypoint-initdb.d/10-auth.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U nareulbom_admin -d nareulbom']
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      NODE_ENV: production
      PORT: '8788'
      DATABASE_URL: postgresql://nareulbom_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}@db:5432/nareulbom
      AUTH_BASE_URL: https://${AUTH_DOMAIN:?Set AUTH_DOMAIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      MFDS_SERVICE_KEY: ${MFDS_SERVICE_KEY:-}
      MFDS_PERMIT_SERVICE_KEY: ${MFDS_PERMIT_SERVICE_KEY:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY_PATH: ${APPLE_PRIVATE_KEY_PATH:-}
    # 기존 NAS 리버스 프록시를 쓰는 경우 NAS 호스트에서만 연결합니다.
    # 프록시가 별도 컨테이너라면 공용 네트워크로 연결하는 방식으로 조정하세요.
    ports: ['127.0.0.1:8788:8788']
    networks: [database, frontend]
  # 기존 HTTPS 프록시가 없을 때만 --profile https 옵션으로 실행합니다.
  # DNS 및 외부 접근 설정이 완료된 후 사용할 수 있습니다.
  proxy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    depends_on: [api]
    environment:
      AUTH_DOMAIN: ${AUTH_DOMAIN:?Set AUTH_DOMAIN}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls-data:/data
      - tls-config:/config
    networks: [frontend]
volumes:
  auth-db:
  tls-data:
  tls-config:
networks:
  database:
    internal: true
  frontend:
